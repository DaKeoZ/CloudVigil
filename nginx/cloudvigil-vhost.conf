# ==============================================================================
# CloudVigil — Virtual Host pour Nginx existant
# ==============================================================================
#
# Ports internes CloudVigil (127.0.0.1 seulement) :
#   CV_API_PORT      = 8001   → FastAPI (API REST + WebSocket)
#   CV_FRONTEND_PORT = 3003   → Next.js  (Dashboard)
#   CV_GRPC_PORT     = 50051  → gRPC     (Agents — port public séparé)
#
# Procédure d'installation (Nginx déjà présent sur le VPS) :
#
#   ÉTAPE 1 — Copier ce fichier
#     sudo cp cloudvigil-vhost.conf /etc/nginx/sites-available/cloudvigil
#     sudo nano /etc/nginx/sites-available/cloudvigil
#       → Remplacer VOTRE_DOMAINE par votre domaine (3 occurrences)
#       → Adapter les ports 8001 / 3003 si besoin
#
#   ÉTAPE 2 — Activer uniquement le bloc HTTP (le bloc 443 est désactivé pour l'instant)
#     sudo ln -s /etc/nginx/sites-available/cloudvigil /etc/nginx/sites-enabled/cloudvigil
#     sudo nginx -t && sudo systemctl reload nginx
#
#   ÉTAPE 3 — Obtenir le certificat Let's Encrypt (Nginx tourne toujours)
#     sudo mkdir -p /var/www/letsencrypt
#     sudo certbot certonly --webroot -w /var/www/letsencrypt -d VOTRE_DOMAINE
#
#   ÉTAPE 4 — Activer le bloc HTTPS
#     Dans ce fichier, supprimer les deux lignes ### DÉSACTIVÉ ### et leurs ### FIN ###
#     (ou simplement décommenter le bloc server { listen 443 ... })
#     sudo nginx -t && sudo systemctl reload nginx
#
#   ÉTAPE 5 — Renouvellement automatique (une seule fois)
#     sudo bash -c 'echo "0 3 * * * root certbot renew --quiet --post-hook \"systemctl reload nginx\"" > /etc/cron.d/certbot-cloudvigil'
# ==============================================================================

# ══════════════════════════════════════════════════════════════════════════════
# BLOC HTTP — Toujours actif
# Gère la validation certbot ET redirige vers HTTPS une fois le cert obtenu
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name VOTRE_DOMAINE;

    # ── Validation Let's Encrypt (webroot) ────────────────────────────────────
    # Certbot dépose un fichier temporaire ici pour prouver que vous contrôlez
    # le domaine. Cette location DOIT être AVANT le return 301.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # ── Redirection HTTP → HTTPS ──────────────────────────────────────────────
    location / {
        return 301 https://$host$request_uri;
    }
}


# ══════════════════════════════════════════════════════════════════════════════
# BLOC HTTPS — À activer APRÈS avoir obtenu le certificat (étape 4)
#
# Pour l'activer : supprimer les deux lignes de commentaires
# "### DÉSACTIVÉ — retirer cette ligne pour activer ###"
# ══════════════════════════════════════════════════════════════════════════════

